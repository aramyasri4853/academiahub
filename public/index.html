<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AcademiaHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styling for the Department Selection Section */
    .section-title {
      text-align: center;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Background glowing blobs for ambient design -->
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>

  <div class="auth-container" style="max-width: 720px; margin: 40px auto; display: flex; flex-direction: column; gap: 24px;">
    <!-- Welcome Header -->
    <div class="auth-header" style="margin-bottom: 10px;">
      <div class="auth-logo">AH</div>
      <h1>AcademiaHub</h1>
      <p>Your premium college campus connection</p>
    </div>

    <!-- 1. DEPARTMENTS DISPLAY -->
    <div class="panel" style="padding: 20px; margin-bottom: 0;">
      <div class="section-title">Select Your Department</div>
      <div class="dept-grid" id="department-grid">
        <div class="dept-card active" onclick="selectDepartment('Computer Science')" id="dept-cs">
          <div class="dept-icon">💻</div>
          <div class="dept-name">Computer Science</div>
          <div class="dept-code">CSE</div>
        </div>
        <div class="dept-card" onclick="selectDepartment('Electronics & Communication')" id="dept-ece">
          <div class="dept-icon">📡</div>
          <div class="dept-name">Electronics</div>
          <div class="dept-code">ECE</div>
        </div>
        <div class="dept-card" onclick="selectDepartment('Civil Engineering')" id="dept-civil">
          <div class="dept-icon">🏗️</div>
          <div class="dept-name">Civil Eng</div>
          <div class="dept-code">CIVIL</div>
        </div>
        <div class="dept-card" onclick="selectDepartment('Mechanical Engineering')" id="dept-mech">
          <div class="dept-icon">⚙️</div>
          <div class="dept-name">Mechanical</div>
          <div class="dept-code">MECH</div>
        </div>
      </div>
    </div>

    <!-- 2. LOGIN AND REGISTER BUTTON TABS -->
    <div class="auth-card" style="width: 100%; box-sizing: border-box;">
      <!-- Seed Database Quick Link for Evaluation -->
      <div id="seed-helper" style="margin-bottom: 24px; border: 1px dashed var(--accent-primary); border-radius: var(--radius-sm); padding: 12px; text-align: center; background: rgba(99, 102, 241, 0.05);">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">First time running? Populate test accounts.</p>
        <button id="btn-seed-db" class="btn-seed" style="width: 100%;">Seed Database (Mock Data)</button>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div class="alert alert-danger" id="auth-alert"></div>
      <div class="alert alert-success" id="auth-success"></div>

      <!-- LOGIN FORM -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-container">
            <input type="email" id="login-email" class="form-input" placeholder="e.g. alice@college.edu" required autocomplete="email">
            <span class="form-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><path d="M22 6l-10 7L2 6"></path></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-container">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <span class="form-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-login-submit">Sign In</button>
      </form>

      <!-- REGISTER FORM (Hidden by default) -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="input-container">
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Charlie Brown" autocomplete="name">
            <span class="form-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="input-container">
            <input type="email" id="reg-email" class="form-input" placeholder="e.g. student@college.edu" autocomplete="email">
            <span class="form-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><path d="M22 6l-10 7L2 6"></path></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-container">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" autocomplete="new-password">
            <span class="form-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-role">Role</label>
          <select id="reg-role" class="form-select" onchange="toggleRoleFields()">
            <option value="student">Student</option>
            <option value="faculty">Faculty Member</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-dept">Department</label>
          <select id="reg-dept" class="form-select" onchange="onDepartmentSelectChange()">
            <option value="Computer Science">Computer Science & Engineering (CSE)</option>
            <option value="Electronics & Communication">Electronics & Communication (ECE)</option>
            <option value="Civil Engineering">Civil Engineering (CIVIL)</option>
            <option value="Mechanical Engineering">Mechanical Engineering (MECH)</option>
          </select>
        </div>

        <!-- Student specific fields -->
        <div id="student-fields">
          <div class="form-group">
            <label class="form-label" for="reg-roll">Roll Number</label>
            <input type="text" id="reg-roll" class="form-input" style="padding-left: 16px;" placeholder="e.g. 1A201">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-class">Class / Section</label>
            <!-- Dropdown selector of sections dynamically populated -->
            <select id="reg-class" class="form-select"></select>
          </div>
        </div>

        <!-- Faculty specific fields (Hidden initially) -->
        <div id="faculty-fields" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="reg-faculty-id">Faculty ID</label>
            <input type="text" id="reg-faculty-id" class="form-input" style="padding-left: 16px;" placeholder="e.g. FAC001">
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-register-submit" style="margin-top: 10px;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
